  <text class="sub" x="560" y="768">📣 SNS llmops-escalations (1 confirmed subscriber) is published by the <tspan fill="#ff6b81">harness-driver λ</tspan> — escalate ·</text>
  <text class="sub" x="560" y="786">page_human · flag_variance — not by the sweep, which only invokes it. 🔍 Macie job llmops-customer-data-pii</text>
  <text class="sub" x="560" y="804">(SCHEDULED daily, scoped customer-data/) is read read-only by the <tspan fill="#ffb454">data-prep harness</tspan>, whose audit</text>
  <text class="sub" x="560" y="822">must state "no Macie job covers this data" whenever none does.</text>
  <rect class="band" x="30" y="860" width="1180" height="104" rx="14"/>
  <text class="bandT" x="50" y="884">STATE — S3: runs/&lt;run_id&gt;/manifest.json · finops/rates rate card · customer-data/ uploads</text>
  <text class="bandT" x="50" y="904">DynamoDB: runs + stage-events + tasks + cost-actuals + cost-estimates · AgentCore: shared Memory</text>
  <text class="sub" x="50" y="928">skills mounted from MLOps-agent-skills — all 19 mounts across all 7 harnesses are s3: a pinned snapshot in the platform bucket (ensure_skills), so no harness reads GitHub at session start</text>
  <text class="sub" x="50" y="946">network: all 7 harnesses run PUBLIC (no networkConfiguration); the VPC is built but no VPC harness variant ships · least-privilege IAM, no *FullAccess · TEST-PROVEN gates per phase</text>
</svg>